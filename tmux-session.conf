##### 🧠 CAP5410 ROI Enhancer – Projekt-spezifische tmux Session #####
##### tmux-session.conf #####

# Maus aktivieren
set -g mouse on

# Farben & Statusbar
set -g default-terminal "screen-256color"
set -g status-position bottom
set -g status-bg colour236
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[bold] #S #[default]"
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=green]%H:%M:%S"

setw -g window-status-current-format "#[bold][#I:#W]"
setw -g window-status-format " #I:#W "

# --- Session "roienhancer" starten ---
# Fenster 1: Jupyter
new-session -d -s roienhancer -n jupyter "bash -c 'source ~/dev/CAP5410-roi-enhancer-odoc/.venv/bin/activate && jupyter lab --no-browser --ip=0.0.0.0 --port=8888 --ServerApp.token=\"\" --ServerApp.password=\"\"'"

# Fenster 2: NVIDIA-SMI Watch
new-window -t roienhancer:2 -n nvidia "watch -n 0.5 nvidia-smi"

# Optional: Fenster 3: Bash / Monitoring / Logs
new-window -t roienhancer:3 -n bash "bash"
# --- Hinweis: ---
# Du kannst dich später wieder verbinden mit:
#   tmux attach -t roienhancer
#
# Und Jupyter ist erreichbar von deinem Mac über:
#   http://100.105.240.68:8888
#
# Session loslösen ohne beenden:
#   Ctrl + B, dann D
#
# Session komplett beenden:
#   tmux kill-session -t roienhancer
